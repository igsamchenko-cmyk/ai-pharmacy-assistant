          type: string
          format: uri
        note:
          type: string
        warnings:
          type: array
          items:
            type: string
    RegulatoryEventType:
      type: string
      enum:
        - temporary_ban
        - permanent_ban
        - restore_temporary
        - restore_permanent
        - partial_cancellation
        - supplement
    RegulatoryEvent:
      type: object
      required:
        - id
        - date
        - documentNumber
        - type
        - severity
        - label
        - registrationNumber
        - medicineName
        - dosageForm
        - series
        - manufacturer
        - additionalInfo
        - sourceUrl
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        documentNumber:
          type: string
        type:
          $ref: "#/components/schemas/RegulatoryEventType"
        severity:
          type: string
          enum: [critical, review, info]
        label:
          type: string
        registrationNumber:
          type: [string, "null"]
        medicineName:
          type: string
        dosageForm:
          type: string
        series:
          type: string
        manufacturer:
          type: string
        additionalInfo:
          type: string
          maxLength: 8000
        sourceUrl:
          type: string
          format: uri
    RegulatoryEventCounts:
      type: object
      required:
        - temporaryBan
        - permanentBan
        - restored
        - other
      properties:
        temporaryBan:
          type: integer
          minimum: 0
        permanentBan:
          type: integer
          minimum: 0
        restored:
          type: integer
          minimum: 0
        other:
          type: integer
          minimum: 0
    RegulatoryRadarSummary:
      type: object
      required:
        - sourceCount
        - currentSourceCount
        - attentionSourceCount
        - recentEventCount
        - eventCounts
      properties:
        sourceCount:
          type: integer
        currentSourceCount:
          type: integer
        attentionSourceCount:
          type: integer
        recentEventCount:
          type: integer
        eventCounts:
          $ref: "#/components/schemas/RegulatoryEventCounts"
    RegulatoryRadarWindow:
      type: object
      required: [from, to, days]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
          enum: [30]
    RegulatoryRadar:
      type: object
      required:
        - version
        - generatedAt
        - status
        - window
        - summary
        - sources
        - events
        - notices
      properties:
        version:
          type: string
          enum: ["1.0"]
        generatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [current, attention]
        window:
          $ref: "#/components/schemas/RegulatoryRadarWindow"
        summary:
          $ref: "#/components/schemas/RegulatoryRadarSummary"
        sources:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/RegulatorySource"
        events:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RegulatoryEvent"
        notices:
          type: array
          items:
            type: string
    RegulatoryRadarRefresh:
      type: object
      required:
        - version
        - status
        - checkedAt
        - nextCheckAt
        - latestDocumentDate
        - recordCount
        - addedCount
        - updatedCount
      properties:
        version:
          type: string
          enum: ["1.0"]
        status:
          type: string
          enum: [current, unchanged, updated, failed]
        checkedAt:
          type: string
          format: date-time
        nextCheckAt:
          type: string
          format: date-time
        latestDocumentDate:
          oneOf:
            - type: string
              pattern: "^\\d{4}-\\d{2}-\\d{2}$"
            - type: "null"
        recordCount:
          type: integer
          minimum: 0
        addedCount:
          type: integer
          minimum: 0
        updatedCount:
          type: integer
          minimum: 0
