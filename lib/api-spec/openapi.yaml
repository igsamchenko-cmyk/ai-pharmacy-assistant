openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for AI Pharmacy Assistant
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Invite-only private beta authentication
  - name: health
    description: Health operations
  - name: beta
    description: Closed beta validation dashboard
  - name: diagnostics
    description: Internal diagnostics and release readiness status
  - name: regulatory
    description: Verified official-source freshness and regulatory change radar
  - name: drugs
    description: Drug search and details
  - name: analogs
    description: Drug analog lookup
  - name: interactions
    description: Drug interaction checking
  - name: ai
    description: AI drug reference generation
  - name: ocr
    description: Package scanning / OCR
  - name: history
    description: User activity history
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Current auth session
      description: >-
        Returns the current private-beta auth state. This response is sanitized
        and never includes session cookies, tokens, passwords, raw environment
        values or provider secrets.
      responses:
        "200":
          description: Current auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: loginAuth
      tags: [auth]
      summary: Login to private beta
      description: >-
        Creates a local invite-only session in development. In Supabase mode,
        the submitted one-time code is verified by the identity provider and
        its verified email is mapped to a server-controlled role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "400":
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invite-only access denied or disabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/challenge:
    post:
      operationId: requestAuthChallenge
      tags: [auth]
      summary: Request a verified email login code
      description: >-
        Requests a one-time email code from the configured identity provider.
        The response is deliberately generic so invite-list membership is not
        disclosed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChallengeRequest"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallengeResponse"
        "400":
          description: Invalid challenge request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many challenge attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutAuth
      tags: [auth]
      summary: Logout from private beta
      description: Clears the local session cookie when present.
      responses:
        "200":
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /beta/dashboard/status:
    get:
      operationId: getBetaDashboardStatus
      tags: [beta]
      summary: Beta dashboard status
      description: >-
        Returns a sanitized closed-beta testing summary for the in-app beta
        dashboard. It uses internal safe validation functions only and never
        exposes secrets, DATABASE_URL values or server filesystem paths.
      responses:
        "200":
          description: Beta dashboard status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDashboardStatus"
  /beta/dashboard/run:
    post:
      operationId: runBetaDashboardCheck
      tags: [beta]
      summary: Run a predefined beta dashboard check
      description: >-
        Runs one of the fixed safe validation checks. The request is limited to
        an enum and does not execute user-provided shell commands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetaDashboardRunRequest"
      responses:
        "200":
          description: Beta dashboard check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDashboardRunResponse"
        "400":
          description: Invalid check type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /diagnostics:
    get:
      operationId: getDiagnostics
      tags: [diagnostics]
      summary: Diagnostics and release readiness status
      description: >-
        Returns sanitized diagnostics for the internal data-quality panel,
        including release metadata, runtime/provider booleans, knowledge counts
        and report availability. Does not expose secrets, database URLs or
        server filesystem paths.
      responses:
        "200":
          description: Sanitized diagnostics panel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsPanelData"
  /drugs:
    get:
      operationId: searchDrugs
      tags: [drugs]
      summary: Search drugs
      description: Search the demo drug database by various fields.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: field
          in: query
          required: false
          schema:
            type: string
            enum: [all, brand, inn, atc, form, dosage]
      responses:
        "200":
          description: Matching drugs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Drug"
  /catalog/search:
    get:
      operationId: searchCatalog
      tags: [drugs]
      summary: Search and browse the production medicine catalog
      description: >-
        Searches approved internal ingredients and the official registry product
        snapshot without loading the full catalog into the client.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
            default: ""
        - name: productId
          in: query
          required: false
          description: Exact registry product identifier used with q=registration number.
          schema:
            type: string
            pattern: "^[A-F0-9]{32}$"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [all, ingredients, registry_products]
            default: all
        - name: view
          in: query
          required: false
          description: >-
            Flat keeps registry browse pagination. When omitted for a non-empty
            registry query, the server resolves grouped view.
          schema:
            type: string
            enum: [flat, grouped]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            multipleOf: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 25
            maximum: 50
            multipleOf: 25
            default: 25
        - name: manufacturer
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: form
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: registrationStatus
          in: query
          required: false
          schema:
            type: string
            enum: [active, terminated, unknown]
        - name: tradeName
          in: query
          required: false
          schema:
            type: string
            maxLength: 180
        - name: strength
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: compositionType
          in: query
          required: false
          schema:
            type: string
            enum: [all, monotherapy, combination, unknown]
            default: all
        - name: mappingStatus
          in: query
          required: false
          schema:
            type: string
            enum: [all, approved, unmapped]
            default: all
        - name: nationalListStatus
          in: query
          required: false
          schema:
            type: string
            enum: [all, exact, ingredient_only, uncertain, not_listed]
            default: all
        - name: groupPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            multipleOf: 1
            default: 1
        - name: groupPageSize
          in: query
          required: false
          schema:
            type: integer
            enum: [10, 25]
            default: 10
        - name: tradePage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            multipleOf: 1
            default: 1
        - name: tradePageSize
          in: query
          required: false
          schema:
            type: integer
            enum: [10, 25]
            default: 10
        - name: variantPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            multipleOf: 1
            default: 1
        - name: variantPageSize
          in: query
          required: false
          schema:
            type: integer
            enum: [10, 25]
            default: 10
        - name: groupKey
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
        - name: tradeNameKey
          in: query
          required: false
          schema:
            type: string
            maxLength: 240
      responses:
        "200":
          description: Bounded catalog search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchResponse"
        "400":
          description: Invalid search parameters
  /catalog/client-index:
    get:
      operationId: getCatalogClientIndex
      tags: [drugs]
      summary: Download the authenticated versioned browser catalog index
      description: >-
        Returns a bounded six-field projection of every current registry product.
        The snapshot SHA-256 is also the ETag. Clients keep the previous IndexedDB
        snapshot active until a changed response has been validated and compiled.
      responses:
        "200":
          description: Complete current client catalog index
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogClientIndexResponse"
        "304":
          description: The client already has the current registry snapshot
        "503":
          description: A safe complete index is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/professional-profile:
    get:
      operationId: getProfessionalProductProfile
      tags: [drugs]
      summary: Get one exact professional registry-product profile
      description: >-
        Resolves one exact product identifier and registration number, then
        aggregates independently bounded registry, National List, instruction,
        Rx/OTC, interaction and series-check source states. A failed or missing
        source stays explicit and never becomes a positive dispensing conclusion.
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-F0-9]{32}$"
        - name: registrationNumber
          in: query
          required: true
          schema:
            type: string
            pattern: '^UA/\d+/\d+/\d+$'
        - name: reimbursementPackageKey
          in: query
          required: false
          schema:
            type: string
            pattern: "^nszu-[a-f0-9]{24}$"
        - name: priceCatalogId
          in: query
          required: false
          schema:
            type: string
            pattern: '^UA-\d{9}-\d{9}-\d{9}$'
      responses:
        "200":
          description: Exact professional product profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalProductProfile"
        "400":
          description: Invalid product identifier or registration number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Exact product and registration pair was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The exact production registry profile is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/product/{registryProductId}/card:
    get:
      operationId: getProductCard
      tags: [drugs]
      summary: Get one aggregated operational card for an exact registry product
      description: >-
        Resolves an exact registry product by its immutable identifier and returns
        identity, dispensing, economic, instruction and series-restriction evidence
        in one response. Missing sources remain explicit and never become a positive
        dispensing or safety conclusion.
      parameters:
        - name: registryProductId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-F0-9]{32}$"
      responses:
        "200":
          description: Aggregated exact-product operational card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCard"
        "400":
          description: Invalid registry product identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Exact registry product was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The exact production registry card is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/products/{productId}/instruction:
    get:
      operationId: getDrugInstruction
      tags: [drugs]
      summary: Get a structured official instruction for one registry product
      description: >-
        Lazily returns a bounded structured snapshot parsed from the official
        Ukrainian registry document for this exact registry product. Missing
        sections remain null. The response contains no generated clinical text,
        secrets, raw environment values or server filesystem paths.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-F0-9]{32}$"
      responses:
        "200":
          description: Structured official instruction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrugInstruction"
        "400":
          description: Invalid registry product identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No verified structured instruction for this product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The exact official DRLZ document could not be retrieved or verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/dispensing-category:
    get:
      operationId: checkProductDispensingCategory
      tags: [drugs]
      summary: Resolve Rx/OTC conditions for one exact registry product
      description: >-
        Resolves the official DRLZ dispensing-conditions field by exact product
        identifier and registration number. Package-dependent, conflicting,
        missing and stale evidence deliberately require manual review.
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-F0-9]{32}$"
        - name: registrationNumber
          in: query
          required: true
          schema:
            type: string
            pattern: "^UA/\\d+/\\d+/\\d+$"
      responses:
        "200":
          description: Exact-product dispensing category assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispensingCategoryCheck"
        "400":
          description: Invalid product or registration identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Verified local DRLZ dispensing-category snapshot is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/series-restrictions:
    get:
      operationId: checkProductSeriesRestrictions
      tags: [drugs]
      summary: Check official quality restrictions for one exact medicine series
      description: >-
        Checks a versioned local snapshot of the official Ukrainian quality-document
        registry by exact registration number and exact series. A no-match result is
        deliberately not an authorization to dispense.
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-F0-9]{32}$"
        - name: registrationNumber
          in: query
          required: true
          schema:
            type: string
            pattern: "^UA/\\d+/\\d+/\\d+$"
        - name: series
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: "^[^\\r\\n]+$"
      responses:
        "200":
          description: Exact series restriction assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesRestrictionCheck"
        "400":
          description: Invalid product, registration or series identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Verified local DLS snapshot is unavailable or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /regulatory-radar:
    get:
      operationId: getRegulatoryRadar
      tags: [regulatory]
      summary: Show official-source freshness and recent regulatory events
      description: >-
        Returns bounded, server-side verified metadata for the official Ukrainian
        pharmacy sources used by FarmAssist and the latest DLS quality-document
        events. Stale or incomplete evidence is never presented as current.
      responses:
        "200":
          description: Regulatory source status and bounded recent-event journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegulatoryRadar"
        "503":
          description: One or more verified regulatory snapshots could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /regulatory-radar/refresh:
    post:
      operationId: refreshRegulatoryRadar
      tags: [regulatory]
      summary: Refresh DLS regulatory data when the verified snapshot is due
      description: >-
        Performs at most one official DLS refresh per 24 hours for the running
        server process. Concurrent app openings share one in-flight refresh.
        Invalid or unavailable upstream data never replaces the last verified
        snapshot.
      responses:
        "200":
          description: Runtime refresh state and retained or promoted snapshot metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegulatoryRadarRefresh"
        "503":
          description: The verified baseline snapshot could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /drugs/stats:
    get:
      operationId: getDrugStats
      tags: [drugs]
      summary: Drug database statistics
      description: Aggregate statistics about the demo drug database.
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrugStats"
  /drugs/{id}:
    get:
      operationId: getDrug
      tags: [drugs]
      summary: Get a single drug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Drug detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drug"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /drugs/{id}/analogs:
    get:
      operationId: getDrugAnalogs
      tags: [analogs]
      summary: Find analogs for a drug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analog groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalogResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /interactions/check:
    post:
      operationId: checkInteractions
      tags: [interactions]
      summary: Check interactions between drugs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryInteractionCheckInput"
      responses:
        "200":
          description: Interaction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryInteractionResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /interactions/instruction-signals:
    post:
      operationId: getInteractionInstructionSignals
      tags: [interactions]
      summary: Find exact ingredient mentions in official instructions
      description: Returns candidate-only signals from exact official product instructions. Signals never change verified runtime rules and absence never means compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryInteractionCheckInput"
      responses:
        "200":
          description: Official instruction signals for each selected product pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionInstructionSignalsResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/summary:
    post:
      operationId: createAiSummary
      tags: [ai]
      summary: Generate an AI drug reference
      description: Generates a structured reference for a drug. Falls back to demo data when no AI key is configured. Blocks self-diagnosis / treatment requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSummaryInput"
      responses:
        "200":
          description: AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSummary"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ocr/scan:
    post:
      operationId: scanPackage
      tags: [ocr]
      summary: Scan a package photo
      description: Runs OCR on an uploaded package image (base64) and returns matching drugs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrScanInput"
      responses:
        "200":
          description: OCR result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /history:
    get:
      operationId: listHistory
      tags: [history]
      summary: List activity history
      responses:
        "200":
          description: History entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"
    post:
      operationId: createHistory
      tags: [history]
      summary: Create a history entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryEntry"
    delete:
      operationId: clearHistory
      tags: [history]
      summary: Clear all history
      responses:
        "204":
          description: Cleared
  /history/{id}:
    delete:
      operationId: deleteHistory
      tags: [history]
      summary: Delete a history entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /sources:
    get:
      operationId: listDataSources
      tags: [external]
      summary: List data source and AI provider status
      description: Reports the live status of every data source (demo catalog, external providers, AI providers) for the data-sources page.
      responses:
        "200":
          description: Data source statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourcesResponse"
  /external/drug:
    get:
      operationId: getExternalDrugReference
      tags: [external]
      summary: Fetch supplementary external drug data
      description: Aggregates RxNorm and openFDA reference data for a drug (by demo id or free-text name). Best-effort — providers that fail return null and never crash the request.
      parameters:
        - name: drugId
          in: query
          required: false
          schema:
            type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: External reference data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalDrugReference"
  /knowledge/search:
    get:
      operationId: knowledgeSearch
      tags: [knowledge]
      summary: Multi-stage Ukrainian drug search
      description: >-
        Resolves a free-text query through the knowledge engine
        (cache → dictionary → local catalog → RxNorm → openFDA → AI). Reports
        which stage answered and returns the canonical ingredient, ATC
        classification, catalog matches and external references. Reference only.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: skipExternal
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Knowledge search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /knowledge/normalize:
    get:
      operationId: normalizeDrugName
      tags: [knowledge]
      summary: Normalize a drug name to its canonical ingredient
      description: >-
        Maps a brand / INN / Latin / English / synonym query to a single
        canonical active ingredient using the drug dictionary.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Normalization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /knowledge/runtime/status:
    get:
      operationId: getKnowledgeRuntimeStatus
      tags: [knowledge]
      summary: Knowledge runtime provider status
      description: >-
        Reports whether the DB-backed dictionary runtime is enabled and
        available, whether static fallback is active, review-status counts for
        imported mappings, the latest import batch and runtime source
        distribution. Reference/admin diagnostics only.
      responses:
        "200":
          description: Runtime provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeRuntimeStatus"
  /knowledge/stats:
    get:
      operationId: getKnowledgeStats
      tags: [knowledge]
      summary: Knowledge engine statistics
      description: Dictionary size, interaction rule count and active resolver ids.
      responses:
        "200":
          description: Knowledge engine stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeStats"
  /knowledge/quality:
    get:
      operationId: getDataQuality
      tags: [knowledge]
      summary: Knowledge-base data-quality report
      description: >-
        Read-only internal report: integrity errors/warnings, record counts and
        provenance coverage over the static knowledge base. Reference data only.
      responses:
        "200":
          description: Data-quality report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityReport"
  /knowledge/sources:
    get:
      operationId: listKnowledgeSources
      tags: [knowledge]
      summary: Provenance source registry
      description: The list of sources knowledge mappings and rules can cite.
      responses:
        "200":
          description: Registered provenance sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvenanceSourceList"
  /knowledge/import/preview:
    get:
      operationId: getImportPreview
      tags: [knowledge]
      summary: Dry-run preview of the bundled dictionary import sample
      description: >-
        Parses and analyzes the bundled sample dictionary import file without
        writing anything. Returns counts, conflicts, confidence and review
        distributions, and whether the import would succeed. Reference data only.
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
  /knowledge/review/queue:
    get:
      operationId: listReviewQueue
      tags: [knowledge]
      summary: List knowledge import review queue
      description: >-
        Lists DB-backed imported knowledge mappings that can be reviewed by an
        admin before they participate in runtime. If the DB is unavailable, the
        endpoint returns an empty queue with warnings and static runtime remains
        active.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReviewQueueStatus"
        - name: conflictOnly
          in: query
          required: false
          schema:
            type: boolean
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
        - name: locale
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResponse"
  /knowledge/review/stats:
    get:
      operationId: getReviewStats
      tags: [knowledge]
      summary: Knowledge review workflow stats
      description: >-
        Returns counts for review statuses, conflicts, low-confidence mappings,
        approved runtime rows and latest audit activity. Safe empty fallback is
        returned when the DB review workflow is unavailable.
      responses:
        "200":
          description: Review stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStats"
  /knowledge/review/{id}/approve:
    post:
      operationId: approveReviewItem
      tags: [knowledge]
      summary: Approve a review item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionBody"
      responses:
        "200":
          description: Approved review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewActionResponse"
        "404":
          description: Review item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DB review workflow unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /knowledge/review/{id}/reject:
    post:
      operationId: rejectReviewItem
      tags: [knowledge]
      summary: Reject a review item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionBody"
      responses:
        "200":
          description: Rejected review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewActionResponse"
        "404":
          description: Review item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DB review workflow unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /knowledge/review/{id}/needs-review:
    post:
      operationId: markReviewItemNeedsReview
      tags: [knowledge]
      summary: Mark a review item as needs_review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionBody"
      responses:
        "200":
          description: Review item marked as needs_review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewActionResponse"
        "404":
          description: Review item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DB review workflow unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /atc/{code}:
    get:
      operationId: getAtcInfo
      tags: [knowledge]
      summary: Resolve an ATC code to its classification
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ATC classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtcInfo"
        "404":
          description: Unknown ATC code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /compare:
    post:
      operationId: compareDrugs
      tags: [knowledge]
      summary: Compare drugs side by side
      description: >-
        Returns an aligned attribute comparison of 2–5 drugs plus a full
        pairwise interaction check between them. Reference only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareInput"
      responses:
        "200":
          description: Comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    AuthProvider:
      type: string
      enum: [local, supabase, disabled]
    AuthMode:
      type: string
      enum: [local_beta, private_beta, supabase, disabled]
    AuthRole:
      type: string
      enum: [admin, reviewer, user, none]
    AuthUser:
      type: object
      required: [email, role, disabled]
      properties:
        email:
          type: string
          format: email
        name:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/AuthRole"
        disabled:
          type: boolean
    AuthSession:
      type: object
      required:
        - authenticated
        - authRequired
        - publicReferenceAccess
        - inviteOnly
        - provider
        - mode
        - role
        - user
        - supabaseConfigured
        - warnings
      properties:
        authenticated:
          type: boolean
        authRequired:
          type: boolean
        publicReferenceAccess:
          type: boolean
        inviteOnly:
          type: boolean
        provider:
          $ref: "#/components/schemas/AuthProvider"
        mode:
          $ref: "#/components/schemas/AuthMode"
        role:
          $ref: "#/components/schemas/AuthRole"
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        supabaseConfigured:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    AuthLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: ["string", "null"]
        password:
          type: ["string", "null"]
        token:
          type: ["string", "null"]
    AuthChallengeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    AuthChallengeResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
    AuthLoginResponse:
      type: object
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/AuthSession"
    AuthLogoutResponse:
      type: object
      required: [ok, session]
      properties:
        ok:
          type: boolean
        session:
          $ref: "#/components/schemas/AuthSession"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    BetaDashboardCheckType:
      type: string
      enum:
        - readiness
        - scenarios
        - search_quality
        - safety
        - interactions
        - real_world
        - ingestion
        - data_quality
        - diagnostics
        - full_safe_check
    BetaDashboardRunStatus:
      type: string
      enum: [ok, warning, failed]
    BetaDashboardRunRequest:
      type: object
      required:
        - checkType
      properties:
        checkType:
          $ref: "#/components/schemas/BetaDashboardCheckType"
    BetaDashboardRunResponse:
      type: object
      required:
        - checkType
        - status
        - score
        - passed
        - failed
        - warnings
        - summary
        - details
        - generatedAt
        - durationMs
      properties:
        checkType:
          $ref: "#/components/schemas/BetaDashboardCheckType"
        status:
          $ref: "#/components/schemas/BetaDashboardRunStatus"
        score:
          oneOf:
            - type: integer
            - type: "null"
        passed:
          type: integer
        failed:
          type: integer
        warnings:
          type: array
          items:
            type: string
        summary:
          type: string
        details:
          type: object
          additionalProperties: true
        generatedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
    BetaDashboardStatus:
      type: object
      required:
        - generatedAt
        - status
        - readiness
        - scenarios
        - searchQuality
        - realWorld
        - ingestion
        - registrySync
        - runtime
        - dataQuality
        - reviewQueue
        - diagnostics
      properties:
        generatedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BetaDashboardRunStatus"
        readiness:
          type: object
          required: [score, ready, summary, warnings]
          properties:
            score:
              type: integer
            ready:
              type: boolean
            summary:
              type: string
            warnings:
              type: array
              items:
                type: string
        scenarios:
          type: object
          required: [passed, failed, total, warnings]
          properties:
            passed:
              type: integer
            failed:
              type: integer
            total:
              type: integer
            warnings:
              type: array
              items:
                type: string
        searchQuality:
          type: object
          required:
            [
              totalQueries,
              hitRatePct,
              topResultAccuracyPct,
              missesCount,
              warnings,
            ]
          properties:
            totalQueries:
              type: integer
            hitRatePct:
              type: integer
            topResultAccuracyPct:
              type: integer
            missesCount:
              type: integer
            warnings:
              type: array
              items:
                type: string
        realWorld:
          type: object
          required:
            [total, passed, missed, recommendedAdditions, hitRatePct, warnings]
          properties:
            total:
              type: integer
            passed:
              type: integer
            missed:
              type: integer
            recommendedAdditions:
              type: integer
            hitRatePct:
              type: integer
            warnings:
              type: array
              items:
                type: string
        ingestion:
          type: object
          required:
            - sourcesApproved
            - registryRawRows
            - registryProducts
            - registryIngredients
            - registryManufacturers
            - registryRegistrations
            - candidateFiles
            - candidateRows
            - approved
            - pending
            - needsReview
            - rejected
            - conflicts
            - ok
            - warnings
          properties:
            sourcesApproved:
              type: integer
            registryRawRows:
              type: integer
            registryProducts:
              type: integer
            registryIngredients:
              type: integer
            registryManufacturers:
              type: integer
            registryRegistrations:
              type: integer
            candidateFiles:
              type: integer
            candidateRows:
              type: integer
            approved:
              type: integer
            pending:
              type: integer
            needsReview:
              type: integer
            rejected:
              type: integer
            conflicts:
              type: integer
            ok:
              type: boolean
            warnings:
              type: array
              items:
                type: string
        registrySync:
          type: object
          required:
            [
              lastSyncedAt,
              sourceHash,
              officialRows,
              farmAssistRows,
              parityStatus,
              missingCount,
              extraCount,
              changedCount,
            ]
          properties:
            lastSyncedAt:
              type: string
              format: date-time
              nullable: true
            sourceHash:
              type: string
              nullable: true
            officialRows:
              type: integer
            farmAssistRows:
              type: integer
            parityStatus:
              type: string
              enum: [exact, mismatch, pending_database_audit]
            missingCount:
              type: integer
              nullable: true
            extraCount:
              type: integer
              nullable: true
            changedCount:
              type: integer
              nullable: true
        runtime:
          type: object
          required:
            [mode, dbConfigured, dbAvailable, staticFallbackEnabled, warnings]
          properties:
            mode:
              type: string
              enum: [static, db]
            dbConfigured:
              type: boolean
            dbAvailable:
              type: boolean
            staticFallbackEnabled:
              type: boolean
            warnings:
              type: array
              items:
                type: string
        dataQuality:
          type: object
          required:
            [
              mappingsCount,
              sourceCoveragePct,
              atcCoveragePct,
              conflicts,
              ok,
              warnings,
            ]
          properties:
            mappingsCount:
              type: integer
            sourceCoveragePct:
              type: integer
            atcCoveragePct:
              type: integer
            conflicts:
              type: integer
            ok:
              type: boolean
            warnings:
              type: array
              items:
                type: string
        reviewQueue:
          type: object
          required: [pending, needsReview, approved, rejected, warnings]
          properties:
            pending:
              type: integer
            needsReview:
              type: integer
            approved:
              type: integer
            rejected:
              type: integer
            warnings:
              type: array
              items:
                type: string
        diagnostics:
          type: object
          required: [releaseLabel, version, warnings]
          properties:
            releaseLabel:
              type: string
            version:
              type: string
            warnings:
              type: array
              items:
                type: string
    DiagnosticsReportStatus:
      type: object
      required:
        - exists
        - updatedAt
      properties:
        exists:
          type: boolean
        updatedAt:
          type: ["string", "null"]
          format: date-time
    DiagnosticsPanelData:
      type: object
      required:
        - app
        - runtime
        - auth
        - providers
        - knowledge
        - reports
        - references
        - warnings
      properties:
        app:
          type: object
          required: [name, releaseLabel, version]
          properties:
            name:
              type: string
              enum: [FarmAssist]
            releaseLabel:
              type: string
            version:
              type: string
        runtime:
          type: object
          required:
            - mode
            - dbConfigured
            - dbRuntimeRequested
            - dbSchemaStatus
            - dbProvider
            - staticFallbackEnabled
          properties:
            mode:
              type: string
              enum: [static, db]
            dbConfigured:
              type: boolean
            dbRuntimeRequested:
              type: boolean
            dbSchemaStatus:
              type: string
            dbProvider:
              type: string
            staticFallbackEnabled:
              type: boolean
        auth:
          type: object
          required:
            - configured
            - publicReferenceAccess
            - required
            - inviteOnly
            - provider
            - mode
            - currentRole
            - supabaseConfigured
            - localBetaMode
            - warnings
          properties:
            configured:
              type: boolean
            required:
              type: boolean
            publicReferenceAccess:
              type: boolean
            inviteOnly:
              type: boolean
            provider:
              $ref: "#/components/schemas/AuthProvider"
            mode:
              $ref: "#/components/schemas/AuthMode"
            currentRole:
              $ref: "#/components/schemas/AuthRole"
            supabaseConfigured:
              type: boolean
            localBetaMode:
              type: boolean
            warnings:
              type: array
              items:
                type: string
        providers:
          type: object
          required: [geminiConfigured, openAiConfigured, openAiEnabled]
          properties:
            geminiConfigured:
              type: boolean
            openAiConfigured:
              type: boolean
            openAiEnabled:
              type: boolean
        knowledge:
          type: object
          required:
            - dictionaryBatchCount
            - mappingsCount
            - ingredientsCount
            - interactionRulesCount
            - approvedDbMappingsCount
          properties:
            dictionaryBatchCount:
              type: integer
            mappingsCount:
              type: integer
            ingredientsCount:
              type: integer
            interactionRulesCount:
              type: integer
            approvedDbMappingsCount:
              type: integer
        reports:
          type: object
          required: [quality, searchQuality, readiness]
          properties:
            quality:
              $ref: "#/components/schemas/DiagnosticsReportStatus"
            searchQuality:
              $ref: "#/components/schemas/DiagnosticsReportStatus"
            readiness:
              $ref: "#/components/schemas/DiagnosticsReportStatus"
        references:
          type: object
          required: [scenarioDocs, checklistDocs]
          properties:
            scenarioDocs:
              type: string
            checklistDocs:
              type: string
        warnings:
          type: array
          items:
            type: string
    DataSourceStatus:
      type: object
      required:
        - id
        - name
        - category
        - status
        - requiresKey
        - detail
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [catalog, external, ai]
        status:
          type: string
          enum: [active, optional, disabled]
        requiresKey:
          type: boolean
        detail:
          type: string
    DataSourcesResponse:
      type: object
      required:
        - sources
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceStatus"
    RxNormInfo:
      type: object
      required:
        - rxcui
        - name
        - ingredients
        - brands
      properties:
        rxcui:
          type: string
        name:
          type: string
        ingredients:
          type: array
          items:
            type: string
        brands:
          type: array
          items:
            type: string
    OpenFdaInfo:
      type: object
      required:
        - brandName
        - genericName
        - manufacturer
        - purpose
        - warnings
      properties:
        brandName:
          type: ["string", "null"]
        genericName:
          type: ["string", "null"]
        manufacturer:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
        warnings:
          type: ["string", "null"]
    ExternalDrugReference:
      type: object
      required:
        - name
        - rxnorm
        - openfda
        - fetchedAt
      properties:
        name:
          type: string
        rxnorm:
          oneOf:
            - $ref: "#/components/schemas/RxNormInfo"
            - type: "null"
        openfda:
          oneOf:
            - $ref: "#/components/schemas/OpenFdaInfo"
            - type: "null"
        fetchedAt:
          type: string
    Drug:
      type: object
      required:
        - id
        - brandName
        - inn
        - form
        - dosage
        - pharmacologicalGroup
        - indications
        - contraindications
        - sideEffects
        - warnings
        - storage
        - source
      properties:
        id:
          type: string
        brandName:
          type: string
        inn:
          type: string
        atcCode:
          type: ["string", "null"]
        form:
          type: string
        dosage:
          type: string
        pharmacologicalGroup:
          type: string
        indications:
          type: string
        contraindications:
          type: string
        sideEffects:
          type: string
        warnings:
          type: string
        storage:
          type: string
        source:
          type: string
    CatalogManufacturer:
      type: object
      required: [name, country]
      properties:
        name:
          type: string
        country:
          type: ["string", "null"]
    CatalogRegistration:
      type: object
      required: [number, startDate, endDate, status]
      properties:
        number:
          type: string
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, terminated, unknown]
    CatalogSource:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
    NationalListSource:
      type: object
      required: [title, actNumber, actDate, revisionDate, effectiveDate, url]
      properties:
        title: { type: string }
        actNumber: { type: string }
        actDate: { type: string }
        revisionDate: { type: string }
        effectiveDate: { type: string }
        url: { type: string }
    NationalListMatchDetails:
      type: object
      required:
        [
          officialName,
          ingredients,
          dosageForms,
          routes,
          strengths,
          ingredientMatch,
          formMatch,
          routeMatch,
          strengthMatch,
        ]
      properties:
        officialName: { type: string }
        ingredients: { type: array, maxItems: 12, items: { type: string } }
        dosageForms: { type: array, maxItems: 20, items: { type: string } }
        routes: { type: array, maxItems: 12, items: { type: string } }
        strengths: { type: array, maxItems: 30, items: { type: string } }
        ingredientMatch:
          { type: string, enum: [match, mismatch, unknown, not_applicable] }
        formMatch:
          { type: string, enum: [match, mismatch, unknown, not_applicable] }
        routeMatch:
          { type: string, enum: [match, mismatch, unknown, not_applicable] }
        strengthMatch:
          { type: string, enum: [match, mismatch, unknown, not_applicable] }
    ApprovedIngredientMapping:
      type: object
      required: [ingredientId, inn, latin, english, atcCode]
      properties:
        ingredientId:
          type: string
        inn:
          type: string
        latin:
          type: string
        english:
          type: string
        atcCode:
          type: ["string", "null"]
    CatalogIngredientResult:
      type: object
      required:
        - resultType
        - ingredientId
        - inn
        - latin
        - english
