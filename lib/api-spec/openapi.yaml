openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for AI Pharmacy Assistant
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: drugs
    description: Drug search and details
  - name: analogs
    description: Drug analog lookup
  - name: interactions
    description: Drug interaction checking
  - name: ai
    description: AI drug reference generation
  - name: ocr
    description: Package scanning / OCR
  - name: history
    description: User activity history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /drugs:
    get:
      operationId: searchDrugs
      tags: [drugs]
      summary: Search drugs
      description: Search the demo drug database by various fields.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: field
          in: query
          required: false
          schema:
            type: string
            enum: [all, brand, inn, atc, form, dosage]
      responses:
        "200":
          description: Matching drugs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Drug"
  /drugs/stats:
    get:
      operationId: getDrugStats
      tags: [drugs]
      summary: Drug database statistics
      description: Aggregate statistics about the demo drug database.
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrugStats"
  /drugs/{id}:
    get:
      operationId: getDrug
      tags: [drugs]
      summary: Get a single drug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Drug detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drug"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /drugs/{id}/analogs:
    get:
      operationId: getDrugAnalogs
      tags: [analogs]
      summary: Find analogs for a drug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analog groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalogResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /interactions/check:
    post:
      operationId: checkInteractions
      tags: [interactions]
      summary: Check interactions between drugs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionCheckInput"
      responses:
        "200":
          description: Interaction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/summary:
    post:
      operationId: createAiSummary
      tags: [ai]
      summary: Generate an AI drug reference
      description: Generates a structured reference for a drug. Falls back to demo data when no AI key is configured. Blocks self-diagnosis / treatment requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSummaryInput"
      responses:
        "200":
          description: AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSummary"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ocr/scan:
    post:
      operationId: scanPackage
      tags: [ocr]
      summary: Scan a package photo
      description: Runs OCR on an uploaded package image (base64) and returns matching drugs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrScanInput"
      responses:
        "200":
          description: OCR result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /history:
    get:
      operationId: listHistory
      tags: [history]
      summary: List activity history
      responses:
        "200":
          description: History entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"
    post:
      operationId: createHistory
      tags: [history]
      summary: Create a history entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryEntry"
    delete:
      operationId: clearHistory
      tags: [history]
      summary: Clear all history
      responses:
        "204":
          description: Cleared
  /history/{id}:
    delete:
      operationId: deleteHistory
      tags: [history]
      summary: Delete a history entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /sources:
    get:
      operationId: listDataSources
      tags: [external]
      summary: List data source and AI provider status
      description: Reports the live status of every data source (demo catalog, external providers, AI providers) for the data-sources page.
      responses:
        "200":
          description: Data source statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourcesResponse"
  /external/drug:
    get:
      operationId: getExternalDrugReference
      tags: [external]
      summary: Fetch supplementary external drug data
      description: Aggregates RxNorm and openFDA reference data for a drug (by demo id or free-text name). Best-effort — providers that fail return null and never crash the request.
      parameters:
        - name: drugId
          in: query
          required: false
          schema:
            type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: External reference data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalDrugReference"
  /knowledge/search:
    get:
      operationId: knowledgeSearch
      tags: [knowledge]
      summary: Multi-stage Ukrainian drug search
      description: >-
        Resolves a free-text query through the knowledge engine
        (cache → dictionary → local catalog → RxNorm → openFDA → AI). Reports
        which stage answered and returns the canonical ingredient, ATC
        classification, catalog matches and external references. Reference only.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: skipExternal
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Knowledge search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /knowledge/normalize:
    get:
      operationId: normalizeDrugName
      tags: [knowledge]
      summary: Normalize a drug name to its canonical ingredient
      description: >-
        Maps a brand / INN / Latin / English / synonym query to a single
        canonical active ingredient using the drug dictionary.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Normalization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /knowledge/runtime/status:
    get:
      operationId: getKnowledgeRuntimeStatus
      tags: [knowledge]
      summary: Knowledge runtime provider status
      description: >-
        Reports whether the DB-backed dictionary runtime is enabled and
        available, whether static fallback is active, review-status counts for
        imported mappings, the latest import batch and runtime source
        distribution. Reference/admin diagnostics only.
      responses:
        "200":
          description: Runtime provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeRuntimeStatus"
  /knowledge/stats:
    get:
      operationId: getKnowledgeStats
      tags: [knowledge]
      summary: Knowledge engine statistics
      description: Dictionary size, interaction rule count and active resolver ids.
      responses:
        "200":
          description: Knowledge engine stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeStats"
  /knowledge/quality:
    get:
      operationId: getDataQuality
      tags: [knowledge]
      summary: Knowledge-base data-quality report
      description: >-
        Read-only internal report: integrity errors/warnings, record counts and
        provenance coverage over the static knowledge base. Reference data only.
      responses:
        "200":
          description: Data-quality report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityReport"
  /knowledge/sources:
    get:
      operationId: listKnowledgeSources
      tags: [knowledge]
      summary: Provenance source registry
      description: The list of sources knowledge mappings and rules can cite.
      responses:
        "200":
          description: Registered provenance sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvenanceSourceList"
  /knowledge/import/preview:
    get:
      operationId: getImportPreview
      tags: [knowledge]
      summary: Dry-run preview of the bundled dictionary import sample
      description: >-
        Parses and analyzes the bundled sample dictionary import file without
        writing anything. Returns counts, conflicts, confidence and review
        distributions, and whether the import would succeed. Reference data only.
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
  /knowledge/review/queue:
    get:
      operationId: listReviewQueue
      tags: [knowledge]
      summary: List knowledge import review queue
      description: >-
        Lists DB-backed imported knowledge mappings that can be reviewed by an
        admin before they participate in runtime. If the DB is unavailable, the
        endpoint returns an empty queue with warnings and static runtime remains
        active.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReviewQueueStatus"
        - name: conflictOnly
          in: query
          required: false
          schema:
            type: boolean
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
        - name: locale
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResponse"
  /knowledge/review/stats:
    get:
      operationId: getReviewStats
      tags: [knowledge]
      summary: Knowledge review workflow stats
      description: >-
        Returns counts for review statuses, conflicts, low-confidence mappings,
        approved runtime rows and latest audit activity. Safe empty fallback is
        returned when the DB review workflow is unavailable.
      responses:
        "200":
          description: Review stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStats"
  /knowledge/review/{id}/approve:
    post:
      operationId: approveReviewItem
      tags: [knowledge]
      summary: Approve a review item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionBody"
      responses:
        "200":
          description: Approved review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewActionResponse"
        "404":
          description: Review item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DB review workflow unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /knowledge/review/{id}/reject:
    post:
      operationId: rejectReviewItem
      tags: [knowledge]
      summary: Reject a review item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionBody"
      responses:
        "200":
          description: Rejected review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewActionResponse"
        "404":
          description: Review item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DB review workflow unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /knowledge/review/{id}/needs-review:
    post:
      operationId: markReviewItemNeedsReview
      tags: [knowledge]
      summary: Mark a review item as needs_review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionBody"
      responses:
        "200":
          description: Review item marked as needs_review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewActionResponse"
        "404":
          description: Review item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DB review workflow unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /atc/{code}:
    get:
      operationId: getAtcInfo
      tags: [knowledge]
      summary: Resolve an ATC code to its classification
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ATC classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtcInfo"
        "404":
          description: Unknown ATC code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /compare:
    post:
      operationId: compareDrugs
      tags: [knowledge]
      summary: Compare drugs side by side
      description: >-
        Returns an aligned attribute comparison of 2–5 drugs plus a full
        pairwise interaction check between them. Reference only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareInput"
      responses:
        "200":
          description: Comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DataSourceStatus:
      type: object
      required:
        - id
        - name
        - category
        - status
        - requiresKey
        - detail
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [catalog, external, ai]
        status:
          type: string
          enum: [active, optional, disabled]
        requiresKey:
          type: boolean
        detail:
          type: string
    DataSourcesResponse:
      type: object
      required:
        - sources
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceStatus"
    RxNormInfo:
      type: object
      required:
        - rxcui
        - name
        - ingredients
        - brands
      properties:
        rxcui:
          type: string
        name:
          type: string
        ingredients:
          type: array
          items:
            type: string
        brands:
          type: array
          items:
            type: string
    OpenFdaInfo:
      type: object
      required:
        - brandName
        - genericName
        - manufacturer
        - purpose
        - warnings
      properties:
        brandName:
          type: ["string", "null"]
        genericName:
          type: ["string", "null"]
        manufacturer:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
        warnings:
          type: ["string", "null"]
    ExternalDrugReference:
      type: object
      required:
        - name
        - rxnorm
        - openfda
        - fetchedAt
      properties:
        name:
          type: string
        rxnorm:
          oneOf:
            - $ref: "#/components/schemas/RxNormInfo"
            - type: "null"
        openfda:
          oneOf:
            - $ref: "#/components/schemas/OpenFdaInfo"
            - type: "null"
        fetchedAt:
          type: string
    Drug:
      type: object
      required:
        - id
        - brandName
        - inn
        - form
        - dosage
        - pharmacologicalGroup
        - indications
        - contraindications
        - sideEffects
        - warnings
        - storage
        - source
      properties:
        id:
          type: string
        brandName:
          type: string
        inn:
          type: string
        atcCode:
          type: ["string", "null"]
        form:
          type: string
        dosage:
          type: string
        pharmacologicalGroup:
          type: string
        indications:
          type: string
        contraindications:
          type: string
        sideEffects:
          type: string
        warnings:
          type: string
        storage:
          type: string
        source:
          type: string
    DrugStats:
      type: object
      required:
        - totalDrugs
        - totalGroups
        - groups
      properties:
        totalDrugs:
          type: integer
        totalGroups:
          type: integer
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"
    GroupCount:
      type: object
      required:
        - group
        - count
      properties:
        group:
          type: string
        count:
          type: integer
    AnalogResult:
      type: object
      required:
        - base
        - full
        - partial
        - therapeutic
        - disclaimer
      properties:
        base:
          $ref: "#/components/schemas/Drug"
        full:
          type: array
          items:
            $ref: "#/components/schemas/Drug"
        partial:
          type: array
          items:
            $ref: "#/components/schemas/Drug"
        therapeutic:
          type: array
          items:
            $ref: "#/components/schemas/Drug"
        disclaimer:
          type: string
    InteractionCheckInput:
      type: object
      required:
        - drugIds
      properties:
        drugIds:
          type: array
          items:
            type: string
    InteractionResult:
      type: object
      required:
        - pairs
        - disclaimer
      properties:
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/InteractionPair"
        disclaimer:
          type: string
    InteractionPair:
      type: object
      required:
        - drugAId
        - drugAName
        - drugBId
        - drugBName
        - riskLevel
        - explanation
        - whatToCheck
        - whenToSeeDoctor
      properties:
        drugAId:
          type: string
        drugAName:
          type: string
        drugBId:
          type: string
        drugBName:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        explanation:
          type: string
        whatToCheck:
          type: string
        whenToSeeDoctor:
          type: string
    AiSummaryInput:
      type: object
      properties:
        drugId:
          type: string
        query:
          type: string
    AiSummary:
      type: object
      required:
        - blocked
        - isFallback
        - disclaimer
      properties:
        blocked:
          type: boolean
        blockedMessage:
          type: ["string", "null"]
        isFallback:
          type: boolean
        drugName:
          type: ["string", "null"]
        whatItIs:
          type: ["string", "null"]
        whatFor:
          type: ["string", "null"]
        mainRisks:
          type: ["string", "null"]
        pharmacistChecklist:
          type: ["string", "null"]
        patientExplanation:
          type: ["string", "null"]
        disclaimer:
          type: string
    OcrScanInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
        manualText:
          type: string
    OcrResult:
      type: object
      required:
        - text
        - matches
        - ocrAvailable
      properties:
        text:
          type: string
        ocrAvailable:
          type: boolean
        detectedName:
          type: ["string", "null"]
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Drug"
    HistoryEntry:
      type: object
      required:
        - id
        - type
        - title
        - detail
        - createdAt
      properties:
        id:
          type: string
        type:
          type: string
          enum: [search, interaction, ai, ocr, analogs]
        title:
          type: string
        detail:
          type: string
        createdAt:
          type: string
    HistoryInput:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum: [search, interaction, ai, ocr, analogs]
        title:
          type: string
        detail:
          type: string
    CanonicalIngredient:
      type: object
      required:
        - inn
        - latin
        - english
        - atc
        - group
      properties:
        inn:
          type: string
        latin:
          type: string
        english:
          type: string
        atc:
          type: string
        group:
          type: string
    AtcInfo:
      type: object
      required:
        - code
        - anatomicalGroup
        - therapeuticClass
        - pharmacologicalClass
      properties:
        code:
          type: string
        anatomicalGroup:
          type: string
        therapeuticClass:
          type: string
        pharmacologicalClass:
          type: string
    DictionaryEntry:
      type: object
      required:
        - name
        - kind
        - ingredient
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [inn, latin, english, brand, synonym]
        ingredient:
          $ref: "#/components/schemas/CanonicalIngredient"
        runtimeSource:
          $ref: "#/components/schemas/RuntimeKnowledgeSource"
        confidence:
          $ref: "#/components/schemas/RuntimeConfidence"
        confidenceScore:
          type: number
        provenance:
          $ref: "#/components/schemas/RuntimeProvenance"
    NormalizeResult:
      type: object
      required:
        - query
        - matched
        - entry
        - source
        - confidence
        - provenance
        - warnings
      properties:
        query:
          type: string
        matched:
          type: boolean
        entry:
          oneOf:
            - $ref: "#/components/schemas/DictionaryEntry"
            - type: "null"
        source:
          $ref: "#/components/schemas/RuntimeKnowledgeSource"
        confidence:
          oneOf:
            - $ref: "#/components/schemas/RuntimeConfidence"
            - type: "null"
        provenance:
          oneOf:
            - $ref: "#/components/schemas/RuntimeProvenance"
            - type: "null"
        warnings:
          type: array
          items:
            type: string
    RuntimeKnowledgeSource:
      type: string
      enum: [db, static, rxnorm, openfda, gemini, fallback]
    RuntimeConfidence:
      type: string
      enum: [low, medium, high, verified]
    RuntimeReviewStatus:
      type: string
      enum: [pending, approved, rejected, needs_review]
    RuntimeProvenance:
      type: object
      required:
        - sourceKey
        - evidenceLevel
      properties:
        sourceKey:
          type: string
        evidenceLevel:
          type: string
        lastReviewed:
          type: string
        sourceLabel:
          type: string
        sourceType:
