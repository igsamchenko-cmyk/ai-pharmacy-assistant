name: Deploy FarmAssist to Render

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Render operation to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - inspect
          - enable-auto-deploy

permissions:
  contents: read

concurrency:
  group: render-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render production deploy
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://farmassist-private-beta.onrender.com
    steps:
      - name: Validate deploy hook configuration
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_DEPLOY_HOOK_URL"
          case "$RENDER_DEPLOY_HOOK_URL" in
            https://api.render.com/deploy/*) ;;
            *)
              echo "::error::RENDER_DEPLOY_HOOK_URL is not a Render deploy hook."
              exit 1
              ;;
          esac

      - name: Ensure public reference access is enabled
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          hook_path="${RENDER_DEPLOY_HOOK_URL%%\?*}"
          service_id="${hook_path##*/}"
          case "$service_id" in
            srv-[a-z0-9]*) ;;
            *)
              echo "::error::Could not derive a Render service ID from the deploy hook."
              exit 1
              ;;
          esac

          env_var_json="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request PUT \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --data '{"value":"true"}' \
            "https://api.render.com/v1/services/${service_id}/env-vars/PUBLIC_REFERENCE_ACCESS")"

          test "$(jq -r '.value // empty' <<<"$env_var_json")" = "true"
          echo "PUBLIC_REFERENCE_ACCESS=true is configured for ${service_id}."

      - name: Deploy exact commit to Render
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          separator="?"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
            separator="&"
          fi

          http_status="$(curl \
            --silent \
            --show-error \
            --output "$RUNNER_TEMP/render-deploy-response.json" \
            --write-out "%{http_code}" \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}")"

          case "$http_status" in
            200)
              echo "Render accepted deployment for commit ${GITHUB_SHA}."
              ;;
            202)
              echo "Render queued deployment for commit ${GITHUB_SHA}."
              ;;
            *)
              echo "::error::Render deploy hook returned HTTP ${http_status}."
              exit 1
              ;;
          esac

  inspect:
    name: Inspect Render production deploys
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://farmassist-private-beta.onrender.com
    steps:
      - name: Read sanitized deployment state
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_DEPLOY_HOOK_URL"

          hook_path="${RENDER_DEPLOY_HOOK_URL%%\?*}"
          service_id="${hook_path##*/}"
          case "$service_id" in
            srv-[a-z0-9]*) ;;
            *)
              echo "::error::Could not derive a Render service ID from the deploy hook."
              exit 1
              ;;
          esac

          service_json="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${service_id}")"

          jq -r '
            (["SERVICE_ID", "NAME", "AUTO_DEPLOY"] | @tsv),
            ([.id, .name, (.autoDeploy // "unknown")] | @tsv)
          ' <<<"$service_json"

          deploys_json="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${service_id}/deploys?limit=20")"

          jq -r '
            (["DEPLOY_ID", "STATUS", "COMMIT", "TRIGGER", "CREATED_AT", "UPDATED_AT"] | @tsv),
            (.[] | [
              .deploy.id,
              .deploy.status,
              (.deploy.commit.id // "-"),
              (.deploy.trigger // "-"),
              (.deploy.createdAt // "-"),
              (.deploy.updatedAt // "-")
            ] | @tsv)
          ' <<<"$deploys_json"

  enable_auto_deploy:
    name: Enable Render Auto-Deploy
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'enable-auto-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://farmassist-private-beta.onrender.com
    steps:
      - name: Enable and verify Auto-Deploy
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_DEPLOY_HOOK_URL"

          hook_path="${RENDER_DEPLOY_HOOK_URL%%\?*}"
          service_id="${hook_path##*/}"
          case "$service_id" in
            srv-[a-z0-9]*) ;;
            *)
              echo "::error::Could not derive a Render service ID from the deploy hook."
              exit 1
              ;;
          esac

          service_json="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request PATCH \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --data '{"autoDeploy":"yes"}' \
            "https://api.render.com/v1/services/${service_id}")"

          auto_deploy="$(jq -r '.autoDeploy // "unknown"' <<<"$service_json")"
          if [[ "$auto_deploy" != "yes" ]]; then
            echo "::error::Render did not confirm Auto-Deploy as enabled."
            exit 1
          fi

          echo "Render Auto-Deploy is enabled for the production service."
