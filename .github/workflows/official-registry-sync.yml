name: Official registry parity and gated sync

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit, profile, metadata reconciliation, or apply"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - profile
          - reconcile
          - apply
      confirm_sha256:
        description: "Required for profile/reconcile/apply; exact audited SHA-256"
        required: false
        type: string
      confirm_production_apply:
        description: "Required for profile/apply; must match its environment secret"
        required: false
        type: string
      confirm_production_reconcile:
        description: "Required for reconcile; must match its dedicated environment secret"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/official-registry-sync.yml"
      - "artifacts/api-server/src/knowledge/ingestion/registry*.ts"
      - "artifacts/api-server/src/knowledge/registryProductionSearchSmoke.ts"
      - "artifacts/api-server/src/knowledge/registryApplyConfirmation.ts"
      - "artifacts/api-server/src/knowledge/registryArtifactPath.ts"
      - "artifacts/api-server/src/knowledge/registryAuditReconciliation.ts"
      - "artifacts/api-server/src/knowledge/registrySyncWorkflowState.ts"
      - "artifacts/api-server/src/scripts/knowledge-registry-confirm-production-apply.ts"
      - "artifacts/api-server/src/scripts/knowledge-registry-artifact-preflight.ts"
      - "artifacts/api-server/src/scripts/knowledge-registry-catalog-db-smoke.ts"
      - "artifacts/api-server/src/scripts/knowledge-registry-reconcile-audit.ts"
      - "artifacts/api-server/src/scripts/knowledge-registry-reconcile-confirm.ts"
      - "artifacts/api-server/src/scripts/knowledge-registry-search-profile-confirm.ts"
      - "artifacts/api-server/src/scripts/knowledge-registry-search-profile.ts"
      - "artifacts/api-server/src/scripts/knowledge-registry-sync-summary.ts"
      - "artifacts/api-server/src/scripts/knowledge-registry-parity.ts"
      - "artifacts/api-server/src/services/catalogSearchService.ts"
      - "lib/db/src/schema/knowledge.ts"

permissions:
  contents: read

concurrency:
  group: official-registry-sync
  cancel-in-progress: false

env:
  OFFICIAL_REGISTRY_URL: http://www.drlz.com.ua/ibp/zvity.nsf/all/zvit/$file/reestr.csv

jobs:
  audit:
    name: Fresh export, full parity plan and anomaly gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/farmassist_registry_sync_ci
      DATABASE_SSL: "false"
      KNOWLEDGE_DB_RUNTIME: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farmassist_registry_sync_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d farmassist_registry_sync_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      source_sha256: ${{ steps.source.outputs.sha256 }}
      downloaded_at: ${{ steps.source.outputs.downloaded_at }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.8.2

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download fresh official DRLZ export once
        id: source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 \
            "$OFFICIAL_REGISTRY_URL" --output "$RUNNER_TEMP/reestr.csv"
          sha256="$(sha256sum "$RUNNER_TEMP/reestr.csv" | cut -d' ' -f1)"
          downloaded_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "downloaded_at=$downloaded_at" >> "$GITHUB_OUTPUT"
          echo "Official source SHA-256: $sha256"

      - name: Product-only import dry-run
        run: >-
          pnpm knowledge:registry:import --
          --file="$RUNNER_TEMP/reestr.csv"
          --products-only

      - name: Enable additive trigram search indexes in CI
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - name: Initialize ephemeral CI schema
        run: pnpm db:push

      - name: Import every fresh official row into ephemeral CI DB
        run: >-
          pnpm knowledge:registry:product-db-smoke --
          --file="$RUNNER_TEMP/reestr.csv"
          --expect-min-products=16000
          --rerun

      - name: Full fresh-export to catalog parity regression
        run: >-
          pnpm knowledge:registry:parity --
          --file="$RUNNER_TEMP/reestr.csv"
          --source-url="$OFFICIAL_REGISTRY_URL"
          --downloaded-at="${{ steps.source.outputs.downloaded_at }}"
          --baseline-report=../../artifacts/reports/catalog-completeness-report.json
          --output=../../artifacts/reports/official-registry-parity-report.json
          --require-db

      - name: Stage immutable registry checkpoint
        shell: bash
        run: |
          set -euo pipefail
          checkpoint_dir="$RUNNER_TEMP/registry-checkpoint"
          mkdir -p "$checkpoint_dir"
          install -m 0644 "$RUNNER_TEMP/reestr.csv" "$checkpoint_dir/reestr.csv"
          install -m 0644 artifacts/reports/official-registry-parity-report.json \
            "$checkpoint_dir/official-registry-parity-report.json"
      - name: Diff safety
        run: git diff --check

      - name: Upload audit and rollback checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: official-registry-${{ github.run_id }}-${{ steps.source.outputs.sha256 }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/registry-checkpoint/

  profile:
    name: Confirmed production read-only search profile
    needs: audit
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'profile'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-registry-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.8.2

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Require fail-closed read-only profile confirmation
        id: profile_confirmation
        continue-on-error: true
        env:
          REGISTRY_PRODUCTION_SEARCH_PROFILE: "true"
          CONFIRM_REGISTRY_SNAPSHOT_SHA: ${{ inputs.confirm_sha256 }}
          AUDITED_REGISTRY_SNAPSHOT_SHA: ${{ needs.audit.outputs.source_sha256 }}
          CONFIRM_PRODUCTION_APPLY_INPUT: ${{ inputs.confirm_production_apply }}
          CONFIRM_PRODUCTION_REGISTRY_APPLY: ${{ secrets.CONFIRM_PRODUCTION_REGISTRY_APPLY }}
          REGISTRY_SYNC_MODE: profile
          REGISTRY_SYNC_PURPOSE: production-registry-search-profile
          REGISTRY_SYNC_ENVIRONMENT: production-registry-sync
        run: pnpm knowledge:registry:search-profile-confirm

      - name: Fail before production access when profile confirmation is invalid
        if: >-
          steps.profile_confirmation.outcome != 'success' ||
          steps.profile_confirmation.outputs.profile_confirmation_passed != 'true'
        run: |
          echo "Production search profile confirmation failed. No database step was started."
          exit 1

      - name: Profile production registry search read-only
        id: search_profile
        env:
          REGISTRY_PRODUCTION_SEARCH_PROFILE: "true"
          CONFIRM_REGISTRY_SNAPSHOT_SHA: ${{ inputs.confirm_sha256 }}
          AUDITED_REGISTRY_SNAPSHOT_SHA: ${{ needs.audit.outputs.source_sha256 }}
          CONFIRM_PRODUCTION_APPLY_INPUT: ${{ inputs.confirm_production_apply }}
          CONFIRM_PRODUCTION_REGISTRY_APPLY: ${{ secrets.CONFIRM_PRODUCTION_REGISTRY_APPLY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_SSL: "true"
          KNOWLEDGE_DB_RUNTIME: "true"
          REGISTRY_SYNC_MODE: profile
          REGISTRY_SYNC_PURPOSE: production-registry-search-profile
          REGISTRY_SYNC_ENVIRONMENT: production-registry-sync
        run: >-
          pnpm knowledge:registry:search-profile --
          --output="$RUNNER_TEMP/registry-production-search-profile.json"

      - name: Upload sanitized production search profile
        if: steps.search_profile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: registry-production-search-profile-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/registry-production-search-profile.json

  reconcile:
    name: Confirmed metadata-only registry audit reconciliation
    needs: audit
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-registry-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.8.2

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Require fail-closed reconciliation confirmation
        id: reconciliation_confirmation
        continue-on-error: true
        env:
          REGISTRY_PRODUCTION_AUDIT_RECONCILIATION: "true"
          CONFIRM_REGISTRY_SNAPSHOT_SHA: ${{ inputs.confirm_sha256 }}
          AUDITED_REGISTRY_SNAPSHOT_SHA: ${{ needs.audit.outputs.source_sha256 }}
          CONFIRM_PRODUCTION_RECONCILE_INPUT: ${{ inputs.confirm_production_reconcile }}
          CONFIRM_PRODUCTION_REGISTRY_RECONCILE: ${{ secrets.CONFIRM_PRODUCTION_REGISTRY_RECONCILE }}
          REGISTRY_SYNC_MODE: reconcile
          REGISTRY_SYNC_PURPOSE: production-registry-audit-reconciliation
          REGISTRY_SYNC_ENVIRONMENT: production-registry-sync
        run: pnpm knowledge:registry:reconcile-confirm

      - name: Fail before production access when reconciliation confirmation is invalid
        if: >-
          steps.reconciliation_confirmation.outcome != 'success' ||
          steps.reconciliation_confirmation.outputs.reconciliation_confirmation_passed != 'true'
        run: |
          echo "Registry audit reconciliation confirmation failed. No database step was started."
          exit 1

      - name: Download the audited immutable checkpoint
        uses: actions/download-artifact@v4
        with:
          name: official-registry-${{ github.run_id }}-${{ needs.audit.outputs.source_sha256 }}
          path: ${{ runner.temp }}/registry-audit

      - name: Verify downloaded registry CSV before DB access
        id: registry_artifact
        env:
          REGISTRY_ARTIFACT_DIRECTORY: ${{ runner.temp }}/registry-audit
        run: pnpm knowledge:registry:artifact-preflight

      - name: Append exact production parity audit metadata
        id: reconcile_registry_audit
        env:
          REGISTRY_PRODUCTION_AUDIT_RECONCILIATION: "true"
          CONFIRM_REGISTRY_SNAPSHOT_SHA: ${{ inputs.confirm_sha256 }}
          AUDITED_REGISTRY_SNAPSHOT_SHA: ${{ needs.audit.outputs.source_sha256 }}
          CONFIRM_PRODUCTION_RECONCILE_INPUT: ${{ inputs.confirm_production_reconcile }}
          CONFIRM_PRODUCTION_REGISTRY_RECONCILE: ${{ secrets.CONFIRM_PRODUCTION_REGISTRY_RECONCILE }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_SSL: "true"
          KNOWLEDGE_DB_RUNTIME: "true"
          REGISTRY_SYNC_MODE: reconcile
          REGISTRY_SYNC_PURPOSE: production-registry-audit-reconciliation
          REGISTRY_SYNC_ENVIRONMENT: production-registry-sync
        run: >-
          pnpm knowledge:registry:reconcile-audit --
          --file="${{ steps.registry_artifact.outputs.csv_path }}"
          --source-url="$OFFICIAL_REGISTRY_URL"
          --downloaded-at="${{ needs.audit.outputs.downloaded_at }}"
          --output="$RUNNER_TEMP/registry-audit-reconciliation.json"

      - name: Upload sanitized reconciliation result
        uses: actions/upload-artifact@v4
        with:
          name: registry-audit-reconciliation-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/registry-audit-reconciliation.json

  apply:
    name: Confirmed additive/upsert and mark-stale update
    needs: audit
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-registry-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.8.2

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Require fail-closed production confirmation
        id: production_confirmation
        continue-on-error: true
        env:
          REGISTRY_SYNC_MODE: ${{ inputs.mode }}
          CONFIRM_REGISTRY_SNAPSHOT_SHA: ${{ inputs.confirm_sha256 }}
          AUDITED_REGISTRY_SNAPSHOT_SHA: ${{ needs.audit.outputs.source_sha256 }}
          CONFIRM_PRODUCTION_APPLY_INPUT: ${{ inputs.confirm_production_apply }}
          CONFIRM_PRODUCTION_REGISTRY_APPLY: ${{ secrets.CONFIRM_PRODUCTION_REGISTRY_APPLY }}
        run: pnpm knowledge:registry:confirm-production-apply

      - name: Fail before production access when confirmation is invalid
        if: >-
          steps.production_confirmation.outcome != 'success' ||
          steps.production_confirmation.outputs.confirmation_passed != 'true'
        run: |
          echo "Production registry confirmation gate failed. No production database step was started."
          exit 1

      - name: Download the audited immutable checkpoint
        uses: actions/download-artifact@v4
        with:
          name: official-registry-${{ github.run_id }}-${{ needs.audit.outputs.source_sha256 }}
          path: ${{ runner.temp }}/registry-audit

      - name: Verify downloaded registry CSV before DB access
        id: registry_artifact
        env:
          REGISTRY_ARTIFACT_DIRECTORY: ${{ runner.temp }}/registry-audit
        run: pnpm knowledge:registry:artifact-preflight
      - name: Enable additive production trigram extension
        run: psql "$PRODUCTION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - name: Apply additive schema changes
        run: pnpm db:push
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_SSL: "true"
          KNOWLEDGE_DB_RUNTIME: "true"

      - name: Apply exact product upsert and mark absent rows stale
        id: apply_registry
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_SSL: "true"
          KNOWLEDGE_DB_RUNTIME: "true"
        run: >-
          pnpm knowledge:registry:parity --
          --file="${{ steps.registry_artifact.outputs.csv_path }}"
          --source-url="$OFFICIAL_REGISTRY_URL"
          --downloaded-at="${{ needs.audit.outputs.downloaded_at }}"
          --require-db
          --apply
          --confirm-apply="${{ inputs.confirm_sha256 }}"
          --checkpoint-artifact="official-registry-${{ github.run_id }}-${{ needs.audit.outputs.source_sha256 }}"
          --commit-state-output="$RUNNER_TEMP/registry-commit-state.json"
          --no-write-report

      - name: Capture post-commit marker
        id: commit_state
        if: always()
        run: >-
          pnpm knowledge:registry:sync-summary --
          --state-file="$RUNNER_TEMP/registry-commit-state.json"
          --apply-outcome="${{ steps.apply_registry.outcome }}"
          --smoke-outcome=skipped
          --outputs-only

      - name: Post-apply full DB search gate
        id: search_smoke
        if: steps.apply_registry.outcome == 'success' && steps.commit_state.outputs.commit_completed == 'true'
        continue-on-error: true
        env:
          REGISTRY_PRODUCTION_SEARCH_SMOKE: "true"
          CONFIRM_REGISTRY_SNAPSHOT_SHA: ${{ inputs.confirm_sha256 }}
          AUDITED_REGISTRY_SNAPSHOT_SHA: ${{ needs.audit.outputs.source_sha256 }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_SSL: "true"
          KNOWLEDGE_DB_RUNTIME: "true"
          REGISTRY_SYNC_MODE: apply
          REGISTRY_SYNC_PURPOSE: post-apply-registry-search-smoke
          REGISTRY_SYNC_ENVIRONMENT: production-registry-sync
          REGISTRY_COMMIT_COMPLETED: ${{ steps.commit_state.outputs.commit_completed }}
          REGISTRY_COMMIT_SNAPSHOT_SHA: ${{ steps.commit_state.outputs.registry_snapshot_hash }}
        run: >-
          pnpm knowledge:registry:catalog-db-smoke --
          --expect-min-products=15000
          --max-warm-ms=2000
          --max-grouped-p95-ms=600
          --max-exact-p50-ms=150
          --max-prefix-p50-ms=250
          --max-navigation-p95-ms=400

      - name: Post-commit state summary
        id: post_commit_summary
        if: always()
        run: >-
          pnpm knowledge:registry:sync-summary --
          --state-file="$RUNNER_TEMP/registry-commit-state.json"
          --apply-outcome="${{ steps.apply_registry.outcome }}"
          --smoke-outcome="${{ steps.search_smoke.outcome }}"

      - name: Fail closed on apply or post-commit smoke failure
        if: >-
          always() &&
          (steps.apply_registry.outcome != 'success' ||
           steps.commit_state.outputs.commit_completed != 'true' ||
           steps.search_smoke.outcome != 'success' ||
           steps.post_commit_summary.outputs.production_parity != 'exact' ||
           steps.post_commit_summary.outputs.registry_snapshot_hash != needs.audit.outputs.source_sha256)
        run: |
          echo "Registry apply or protected post-commit verification failed. Review the job summary."
          exit 1
