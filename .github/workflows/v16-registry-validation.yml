name: v1.6 Registry Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/**"
      - "data/**"
      - "docs/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/v16-registry-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farmassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d farmassist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: "5173"
      BASE_PATH: "/"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Codegen
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Schema push
        run: pnpm db:push
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/farmassist_test"
          DATABASE_SSL: "false"

      - name: Registry product DB smoke
        run: |
          pnpm knowledge:registry:product-db-smoke -- --download --limit=10 --expect-min-products=10 --rerun
          pnpm knowledge:registry:product-db-smoke -- --download --limit=500 --expect-min-products=500 --rerun
          pnpm knowledge:registry:product-db-smoke -- --download --expect-min-products=16533 --rerun
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/farmassist_test"
          DATABASE_SSL: "false"
          KNOWLEDGE_DB_RUNTIME: "true"

      - name: Registry approved mapping DB smoke
        run: |
          pnpm knowledge:registry:mapping-db-smoke -- --download --limit=10 --expect-min-mappings=10 --rerun --verify-timeouts
          pnpm knowledge:registry:mapping-db-smoke -- --download --limit=100 --expect-min-mappings=100 --rerun
          pnpm knowledge:registry:mapping-db-smoke -- --download --limit=500 --expect-min-mappings=500 --rerun
          pnpm knowledge:registry:mapping-db-smoke -- --download --expect-min-mappings=1217 --rerun
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/farmassist_test"
          DATABASE_SSL: "false"
          KNOWLEDGE_DB_RUNTIME: "true"

      - name: Registry catalog DB search smoke
        run: pnpm knowledge:registry:catalog-db-smoke -- --expect-min-products=16533 --expect-products=16533 --max-warm-ms=2000 --max-grouped-p95-ms=600 --max-exact-p50-ms=150 --max-prefix-p50-ms=250 --max-navigation-p95-ms=400
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/farmassist_test"
          DATABASE_SSL: "false"
          KNOWLEDGE_DB_RUNTIME: "true"

      - name: Upload catalog DB coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-search-db-coverage-report
          path: artifacts/reports/catalog-search-db-coverage-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Registry production dry-runs
        run: |
          pnpm knowledge:sources:discover
          pnpm knowledge:registry:production-report
          pnpm knowledge:registry:preview -- --download
          pnpm knowledge:registry:import -- --download --mappings-only --only-approved-mappings
          pnpm knowledge:national-list:source
          pnpm knowledge:national-list:dry-run
          pnpm knowledge:national-list:match-report

      - name: National List PostgreSQL smoke
        run: pnpm knowledge:national-list:db-smoke
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/farmassist_test"
          DATABASE_SSL: "false"
          KNOWLEDGE_DB_RUNTIME: "true"

      - name: Knowledge validation
        run: |
          pnpm knowledge:import:preview:all
          pnpm knowledge:import:validate:all
          pnpm knowledge:backfill
          pnpm knowledge:runtime:verify
          pnpm knowledge:quality:report
          pnpm knowledge:search:report
          pnpm knowledge:real-world:report
          pnpm knowledge:interactions:audit
          pnpm knowledge:instructions:report
          pnpm beta:scenarios
          pnpm beta:readiness

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm -r test

      - name: Build
        run: pnpm run build

      - name: Diff checks
        run: |
          git diff --check origin/main..HEAD
          git diff --check
          git diff --exit-code
